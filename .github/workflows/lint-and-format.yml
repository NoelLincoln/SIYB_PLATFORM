name: Lint, Format and Test

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

# Needed by the failure-comment step below; the default token is read-only.
permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26. Node 20 fails at import
      # time because undici calls worker_threads.markAsUncloneable, absent there.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Check formatting with Prettier
        working-directory: ./frontend
        run: npm run format:check

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Comment on PR if checks fail
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Checks failed. Run `npm run format`, `npm run lint` and `npm run test:coverage` in ./frontend locally before pushing. Coverage is gated at 100%.'
            })
